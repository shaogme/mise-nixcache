name: List & Inspect Build Cache

on:
  workflow_dispatch:
    inputs:
      view_mode:
        description: 'Query View Preset'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'          # 全量概览与架构分布
          - 'filter'       # 按名称/路径/模式自定义筛选
          - 'top_size'     # 体积最大产物排行 (Top Heavy Packages)
          - 'recent'       # 最近 24 小时新构建产物
          - 'outputs'      # 当前 mise-nixcache Flake 输出闭包匹配
      patterns:
        description: 'Pattern match (e.g. *mise*, *rust*, *linux*)'
        required: false
        default: ''
        type: string
      system:
        description: 'Target Architecture (choose all for all systems)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'x86_64-linux'
          - 'aarch64-linux'
          - 'aarch64-darwin'
      target_tag:
        description: 'Target OCI Tag (e.g. cache-index, run-123456)'
        required: false
        default: 'cache-index'
        type: string
      limit:
        description: 'Display Item Limit'
        required: false
        default: '50'
        type: string
      format:
        description: 'Output Format'
        required: true
        default: 'table'
        type: choice
        options:
          - 'table'
          - 'summary'
          - 'json'
          - 'paths'

permissions:
  contents: read
  packages: read

jobs:
  list-cache:
    name: Inspect Cache (${{ github.event.inputs.view_mode }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Execute Cache Query
        uses: shaogme/nixcache-oci/list@main
        with:
          all: ${{ github.event.inputs.view_mode == 'all' || github.event.inputs.view_mode == 'top_size' }}
          flake-path: ${{ github.event.inputs.view_mode == 'outputs' && '.' || '' }}
          patterns: ${{ github.event.inputs.patterns }}
          system: ${{ github.event.inputs.system != 'all' && github.event.inputs.system || '' }}
          newer-than: ${{ github.event.inputs.view_mode == 'recent' && '24h' || '' }}
          sort-by: ${{ github.event.inputs.view_mode == 'top_size' && 'size' || (github.event.inputs.view_mode == 'recent' && 'date' || 'date') }}
          sort-order: 'desc'
          target-tag: ${{ github.event.inputs.target_tag || 'cache-index' }}
          limit: ${{ github.event.inputs.limit || '50' }}
          format: ${{ github.event.inputs.format || 'table' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
