name: CI, Build & Multi-Arch Cache Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 阶段 0: 静态质量与依赖校验 (Fail-Fast)
  # =========================================================================
  static-checks:
    name: 0. Static Quality & Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install npins CLI
        run: |
          nix profile install nixpkgs#npins

      - name: Verify npins Dependencies Integrity
        run: |
          echo ">>> Verifying npins dependency hashes..."
          npins verify

      - name: Run Static Derivation Evaluation Check
        run: |
          echo ">>> Running static derivation evaluation check..."
          nix-build tests/default.nix -A eval-check --no-out-link

      - name: Run NixOS Module Static Evaluation Check
        run: |
          echo ">>> Running NixOS module static evaluation check..."
          nix-build tests/default.nix -A module-eval-check --no-out-link

      - name: Verify Flake Outputs Evaluation Across Systems
        run: |
          echo ">>> Verifying Flake packages and module outputs..."
          nix eval path:.#packages.x86_64-linux.mise.name
          nix eval path:.#packages.aarch64-linux.mise.name
          nix eval path:.#packages.x86_64-darwin.mise.name
          nix eval path:.#packages.aarch64-darwin.mise.name
          nix eval path:.#nixosModules.default

  # =========================================================================
  # 阶段 1: NixOS VM 运行期测试 (结合 NixCache 会话级加速)
  # =========================================================================
  vm-test:
    name: 1. NixOS VM Driver & Integration Test
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup NixCache Session Acceleration
        uses: shaogme/nixcache-oci/setup@main
        with:
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure KVM Device Permissions
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo ">>> Hardware KVM acceleration enabled."
          else
            echo ">>> KVM device not found, falling back to software emulation."
          fi

      - name: Run Mise VM Availability Test
        run: |
          echo ">>> Running NixOS VM test suite..."
          nix-build tests/default.nix -A vmtest --no-out-link

      - name: Capture & Upload Session Cache
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: shaogme/nixcache-oci/capture@main
        with:
          system: 'x86_64-linux'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 阶段 2: 质量门禁 (CI Success Gate)
  # =========================================================================
  ci-success:
    name: 2. CI Gate Success
    runs-on: ubuntu-latest
    needs: [static-checks, vm-test]
    if: always()
    steps:
      - name: Assert Required Checks Passed
        run: |
          if [ "${{ needs.static-checks.result }}" != "success" ] || [ "${{ needs.vm-test.result }}" != "success" ]; then
            echo "::error::One or more mandatory CI checks failed."
            echo "static-checks result: ${{ needs.static-checks.result }}"
            echo "vm-test result: ${{ needs.vm-test.result }}"
            exit 1
          fi
          echo "All preliminary CI verification checks passed successfully."

  # =========================================================================
  # 阶段 3: 多平台并行编译与 NAR 上传 (Scatter - 4 大主流架构)
  # =========================================================================
  publish-cache-matrix:
    name: 3. Scatter Build (${{ matrix.system }})
    needs: [ci-success]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-26-intel
            system: x86_64-darwin
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build Flake Outputs & Push NAR Blobs
        uses: shaogme/nixcache-oci/build@main
        with:
          system: ${{ matrix.system }}
          mode: 'flake'
          flake-path: '.'
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          strict: 'true'
          export-concurrency: '4'

  # =========================================================================
  # 阶段 4: 汇聚并原子发布多架构缓存索引 (Gather & Promote)
  # =========================================================================
  publish-cache-index:
    name: 4. Gather & Promote Multi-Arch Cache Index
    needs: [publish-cache-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Promote Session & Publish Global Index
        uses: shaogme/nixcache-oci/promote@main
        with:
          target-tag: 'cache-index'
          github-token: ${{ secrets.GITHUB_TOKEN }}
