name: Mise Cache Garbage Collection

on:
  schedule:
    # 每周日凌晨 03:00 UTC 运行垃圾回收
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: '保留天数 (超过且不在当前闭包中的缓存将被清理)'
        required: true
        default: '30'
      dry_run:
        description: '试运行 (Dry run, 仅输出不实际删除)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  garbage-collect:
    name: Run OCI Cache GC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run Garbage Collection
        uses: shaogme/nixcache-oci/gc@main
        with:
          retention-days: ${{ github.event.inputs.retention_days || '30' }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

